# Template defaults for the generated oMNI vLLM compose file. Edit docker-compose.vllm.template.yml or
# admin proxy settings, then regenerate instead of hand-editing this file.
services:
  omlx-proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile.proxy
    ports:
      - "${OMLX_PROXY_PORT:-8080}:8080"
    environment:
      OMLX_BACKEND_URL: "http://vllm:8000/v1"
      OMLX_BACKEND_API_KEY: "${OMLX_BACKEND_API_KEY:-}"
      OMLX_PROXY_API_KEY: "${OMLX_PROXY_API_KEY:-}"
      OMLX_PROXY_HOST: "0.0.0.0"
      OMLX_PROXY_PORT: "8080"
      OMLX_CONTEXT_SCALING: "${OMLX_CONTEXT_SCALING:-false}"
      OMLX_TARGET_CONTEXT_SIZE: "${OMLX_TARGET_CONTEXT_SIZE:-200000}"
      OMLX_ACTUAL_CONTEXT_SIZE: "${VLLM_MAX_MODEL_LEN:-8192}"
      OMLX_SSE_KEEPALIVE_MODE: "${OMLX_SSE_KEEPALIVE_MODE:-ping}"
      OMLX_PROXY_STATE_PATH: "/data/proxy-state.json"
      OMLX_VLLM_COMPOSE_OUTPUT_PATH: "/compose-output/docker-compose.vllm.yml"
    volumes:
      - proxy-state:/data
      - ../docker:/compose-output
    depends_on:
      - vllm

  vllm:
    image: "${VLLM_IMAGE:-vllm/vllm-openai:latest}"
    ports:
      - "${VLLM_PORT:-8000}:8000"
    ipc: host
    gpus: all
    environment:
      VLLM_IMAGE: "${VLLM_IMAGE:-vllm/vllm-openai:latest}"
      VLLM_MODEL: "${VLLM_MODEL:-Qwen/Qwen3-1.7B}"
      VLLM_SERVED_MODEL_NAME: "${VLLM_SERVED_MODEL_NAME:-qwen}"
      VLLM_MAX_MODEL_LEN: "${VLLM_MAX_MODEL_LEN:-8192}"
      VLLM_GPU_MEMORY_UTILIZATION: "${VLLM_GPU_MEMORY_UTILIZATION:-0.8}"
      VLLM_MAX_NUM_SEQS: "${VLLM_MAX_NUM_SEQS:-4}"
      VLLM_PORT: "${VLLM_PORT:-8000}"
      VLLM_HF_HOME: "${VLLM_HF_HOME:-${HOME}/.cache/huggingface}"
      VLLM_GENERATION_CONFIG: "${VLLM_GENERATION_CONFIG:-vllm}"
      VLLM_DEFAULT_CHAT_TEMPLATE_KWARGS: "${VLLM_DEFAULT_CHAT_TEMPLATE_KWARGS:-{\"enable_thinking\":false}}"
      VLLM_TRUST_REMOTE_CODE: "${VLLM_TRUST_REMOTE_CODE:-true}"
      VLLM_ENFORCE_EAGER: "${VLLM_ENFORCE_EAGER:-false}"
      VLLM_ENABLE_AUTO_TOOL_CHOICE: "${VLLM_ENABLE_AUTO_TOOL_CHOICE:-false}"
      VLLM_TOOL_CALL_PARSER: "${VLLM_TOOL_CALL_PARSER:-hermes}"
      VLLM_REASONING_PARSER: "${VLLM_REASONING_PARSER:-}"
      OMLX_PROXY_PORT: "${OMLX_PROXY_PORT:-8080}"
      OMLX_PROXY_API_KEY: "${OMLX_PROXY_API_KEY:-}"
      OMLX_BACKEND_API_KEY: "${OMLX_BACKEND_API_KEY:-}"
      OMLX_CONTEXT_SCALING: "${OMLX_CONTEXT_SCALING:-false}"
      OMLX_TARGET_CONTEXT_SIZE: "${OMLX_TARGET_CONTEXT_SIZE:-200000}"
      OMLX_SSE_KEEPALIVE_MODE: "${OMLX_SSE_KEEPALIVE_MODE:-ping}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HUGGING_FACE_HUB_TOKEN: "${HUGGING_FACE_HUB_TOKEN:-${HF_TOKEN:-}}"
      HF_HOME: "/root/.cache/huggingface"
    volumes:
      - "${VLLM_HF_HOME:-${HOME}/.cache/huggingface}:/root/.cache/huggingface"
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        set -eu
        set -- "$${VLLM_MODEL:?Set VLLM_MODEL to a Hugging Face model id or local container path}"
        set -- "$${@}" --host 0.0.0.0
        set -- "$${@}" --port 8000
        set -- "$${@}" --served-model-name "$${VLLM_SERVED_MODEL_NAME:-$${VLLM_MODEL}}"
        set -- "$${@}" --max-model-len "$${VLLM_MAX_MODEL_LEN:-8192}"
        set -- "$${@}" --gpu-memory-utilization "$${VLLM_GPU_MEMORY_UTILIZATION:-0.80}"
        set -- "$${@}" --max-num-seqs "$${VLLM_MAX_NUM_SEQS:-4}"
        set -- "$${@}" --generation-config "$${VLLM_GENERATION_CONFIG:-vllm}"
        if [ -n "$${VLLM_DEFAULT_CHAT_TEMPLATE_KWARGS:-}" ]; then
          set -- "$${@}" --default-chat-template-kwargs "$${VLLM_DEFAULT_CHAT_TEMPLATE_KWARGS}"
        fi
        if [ "$${VLLM_TRUST_REMOTE_CODE:-true}" = "true" ]; then
          set -- "$${@}" --trust-remote-code
        fi
        if [ "$${VLLM_ENFORCE_EAGER:-false}" = "true" ]; then
          set -- "$${@}" --enforce-eager
        fi
        if [ "$${VLLM_ENABLE_AUTO_TOOL_CHOICE:-false}" = "true" ]; then
          set -- "$${@}" --enable-auto-tool-choice
          if [ -n "$${VLLM_TOOL_CALL_PARSER:-}" ]; then
            set -- "$${@}" --tool-call-parser "$${VLLM_TOOL_CALL_PARSER}"
          fi
        fi
        if [ -n "$${VLLM_REASONING_PARSER:-}" ]; then
          set -- "$${@}" --reasoning-parser "$${VLLM_REASONING_PARSER}"
        fi
        exec vllm serve "$${@}"

volumes:
  proxy-state:
